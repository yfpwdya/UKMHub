<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<title>DFD UKMHub – PowerDesigner Style</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    padding: 20px;
  }
  h1 {
    text-align: center;
    font-size: 22px;
    color: #00d4ff;
    margin-bottom: 4px;
    letter-spacing: 1px;
  }
  h2 {
    text-align: center;
    font-size: 13px;
    color: #888;
    margin-bottom: 24px;
    font-weight: normal;
  }
  .tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 24px;
  }
  .tab {
    padding: 8px 20px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #16213e;
    color: #aaa;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .tab.active {
    background: #0f3460;
    color: #00d4ff;
    border-color: #00d4ff;
  }
  .diagram { display: none; }
  .diagram.active { display: block; }

  /* ——— LEGEND ——— */
  .legend {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #bbb;
  }
  .legend-box {
    width: 24px; height: 14px;
    border-radius: 3px;
  }
  .legend-circle {
    width: 14px; height: 14px;
    border-radius: 50%;
  }
  .legend-rect  { background:#1f5c8b; border:1.5px solid #00d4ff; }
  .legend-proc  { background:#2d6a4f; border:1.5px solid #52b788; border-radius:50%; width:14px; height:14px; }
  .legend-ds    { background:#3d2b1f; border:1.5px solid #e07c39; }
  .legend-ext   { background:#3b2157; border:1.5px solid #c77dff; }
  .legend-arrow { width:30px; height:2px; background:#555; position:relative; }
  .legend-arrow::after { content:''; position:absolute; right:0; top:-3px; border:4px solid transparent; border-left:6px solid #555; }

  svg { width: 100%; height: auto; display: block; }

  /* tooltip */
  .tt { position: fixed; background: #0d1b2a; border: 1px solid #00d4ff; padding: 8px 12px;
        border-radius: 6px; font-size: 12px; color: #cce; pointer-events: none;
        display: none; max-width: 260px; line-height: 1.5; z-index: 9999; }
</style>
</head>
<body>

<h1>📊 Data Flow Diagram — UKMHub</h1>
<h2>Sistem Pendaftaran Unit Kegiatan Mahasiswa · PowerDesigner Style</h2>
